server:
  port: 8080

spring:
  application:
    name: AgenteIAEstoque

  datasource:
    url: jdbc:postgresql://localhost:5001/estoque_db
    username: root
    password: root
    driver-class-name: org.postgresql.Driver

  # 2. Configurações do Hibernate/JPA
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true 
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # 3. Configuração do Spring AI (Conexão com o LLM Local)
  ai:
    ollama:
      base-url: http://localhost:11001
      chat:
        options:
          model: llama3
          temperature: 0.0

  flyway:
    enabled: true
    baseline-on-migrate: true