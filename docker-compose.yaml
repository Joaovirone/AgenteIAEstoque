services:

  ollama:
    image: 'ollama/ollama:latest'
    container_name: estoque-ollama
    ports:
      - '11001:11434'
    volumes:
      - ollama_data:/root/.ollama 
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama-init:
    image: 'ollama/ollama:latest'
    container_name: ollama-pull-model
    depends_on:
      ollama:
        condition: service_healthy 
    environment:
      - OLLAMA_HOST=http://ollama:11434
    command: sh -c "ollama pull llama3.2 && ollama pull nomic-embed-text"

  postgres:
    image: 'pgvector/pgvector:pg15'
    container_name: estoque-db
    environment:
      - 'POSTGRES_DB=estoque_db'
      - 'POSTGRES_PASSWORD=root'
      - 'POSTGRES_USER=root'
    ports:
      - '5001:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d estoque_db"]
      interval: 10s
      timeout: 5s
      retries: 3

  api-agent:
    build: .
    container_name: estoque-api
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully 
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/estoque_db 
      - SPRING_DATASOURCE_USERNAME=root 
      - SPRING_DATASOURCE_PASSWORD=root 
      - SPRING_AI_OLLAMA_BASE_URL=http://ollama:11434

volumes:
  db_data:
  ollama_data: 