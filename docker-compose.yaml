services:

  ollama:
    image: 'ollama/ollama:latest'
    container_name: estoque-ollama
    ports:
      - '11001:11434'
    volumes:
      - ollama_data:/root/.ollama 
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama-init:
    image: 'curlimages/curl:8.8.0'
    container_name: ollama-pull-model
    depends_on:
      ollama:
        condition: service_healthy 
    restart: on-failure
    entrypoint:
      - /bin/sh
      - -ec
      - |
        curl -sS -X POST http://ollama:11434/api/pull -H 'Content-Type: application/json' --data '{"name":"llama3.2","stream":false}'
        curl -sS -X POST http://ollama:11434/api/pull -H 'Content-Type: application/json' --data '{"name":"nomic-embed-text","stream":false}'
        curl -sS http://ollama:11434/api/tags

  postgres:
    image: 'pgvector/pgvector:pg15'
    container_name: estoque-db
    environment:
      - 'POSTGRES_DB=estoque_db'
      - 'POSTGRES_PASSWORD=root'
      - 'POSTGRES_USER=root'
    ports:
      - '5001:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d estoque_db"]
      interval: 10s
      timeout: 5s
      retries: 3

  api-agent:
    build: .
    container_name: estoque-api
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully 
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/estoque_db 
      - SPRING_DATASOURCE_USERNAME=root 
      - SPRING_DATASOURCE_PASSWORD=root 
      - SPRING_AI_OLLAMA_BASE_URL=http://ollama:11434

  frontend-ui:
    build:
      context: ./agente-estoque-ui
      dockerfile: Dockerfile
    container_name: estoque-ui
    environment:
      - API_URL=/api
    ports:
      - "4200:80"
    depends_on:
      - api-agent

volumes:
  db_data:
  ollama_data: 